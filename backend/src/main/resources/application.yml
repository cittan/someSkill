server:
  port: 8080

spring:
  application:
    name: oa-roster
  datasource:
    url: jdbc:postgresql://localhost:5432/oa
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml   # SQL 与接口分离，便于审查与调优
  configuration:
    map-underscore-to-camel-case: true        # emp_no -> empNo 自动驼峰映射
  type-aliases-package: com.oa.roster.entity

logging:
  level:
    com.oa.roster: info
